name: Build YueDu Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Cache sherpa-onnx AAR
        id: cache-sherpa
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-2.0.3.aar
          key: sherpa-onnx-aar-v2.0.3

      - name: Download sherpa-onnx AAR
        if: steps.cache-sherpa.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx-2.0.3.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar

      - name: Cache Built-in Yunxi FP32 Voice Model
        id: cache-yunxi-vits
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/tts_models/vits-zh-hf-fanchen-wnj
          key: yunxi-vits-fp32-wnj-v1

      - name: Prepare Built-in Yunxi FP32 Voice Assets
        if: steps.cache-yunxi-vits.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/yunxi_dl app/src/main/assets/tts_models/vits-zh-hf-fanchen-wnj
          curl -L --fail --retry 3 -o /tmp/yunxi_dl/wnj.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-zh-hf-fanchen-wnj.tar.bz2
          tar -xjf /tmp/yunxi_dl/wnj.tar.bz2 -C /tmp/yunxi_dl
          cp /tmp/yunxi_dl/vits-zh-hf-fanchen-wnj/vits-zh-hf-fanchen-wnj.onnx \
             /tmp/yunxi_dl/vits-zh-hf-fanchen-wnj/lexicon.txt \
             /tmp/yunxi_dl/vits-zh-hf-fanchen-wnj/tokens.txt \
             /tmp/yunxi_dl/vits-zh-hf-fanchen-wnj/phone.fst \
             /tmp/yunxi_dl/vits-zh-hf-fanchen-wnj/date.fst \
             /tmp/yunxi_dl/vits-zh-hf-fanchen-wnj/number.fst \
             app/src/main/assets/tts_models/vits-zh-hf-fanchen-wnj/
          rm -rf /tmp/yunxi_dl

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename and Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk YueDu-v0.5.0-debug.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs YueDu-v0.5.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueDu-v0.5.0-debug-apk
          path: YueDu-v0.5.0-debug.apk

      - name: Publish v0.5.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-preview
          name: 悦读 YueDu v0.5.0
          body: |
            悦读 YueDu v0.5.0 更新内容：
            - 书架书籍封面调整为纯净现代扁平化设计，去除实物书脊与拟物阴影
            - 修复离线 AI 语音试听杂音问题（替换掉含 ARM64 INT8 杂音的 Kokoro-int8 模型，改用纯净 FP32 模型 + 16-bit PCM 防爆音音频管线）
            - 仅将「云希」内置于安装包（并移除冗余标签），其余音色全部改为独立按需下载，互不联动
          files: YueDu-v0.5.0-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
