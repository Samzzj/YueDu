name: Build YueDu Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Cache sherpa-onnx AAR
        id: cache-sherpa
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-2.0.3.aar
          key: sherpa-onnx-aar-v2.0.3

      - name: Download sherpa-onnx AAR
        if: steps.cache-sherpa.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx-2.0.3.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename and Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk YueDu-v0.3.0-debug.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs YueDu-v0.3.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueDu-v0.3.0-debug-apk
          path: YueDu-v0.3.0-debug.apk

      - name: Publish v0.3.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-preview
          name: 悦读 YueDu v0.3.0
          body: |
            悦读 YueDu v0.3.0 更新内容：
            - 字体库直连国内镜像源，下载迅速稳定
            - 新增离线 AI 语音包下载（基于 sherpa-onnx），下载后零延迟离线朗读
            - AI 阅读页精简界面（去掉音调滑块），点击音色直接试听，右侧支持一键下载到本地
            - 放大阅读页听书悬浮胶囊按钮，去掉阅读页顶部重复听书按钮
            - 修复朗读播放过程中的异步并发闪退问题
          files: YueDu-v0.3.0-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
