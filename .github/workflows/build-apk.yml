name: Build YueDu Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Cache sherpa-onnx AAR
        id: cache-sherpa
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-2.0.3.aar
          key: sherpa-onnx-aar-v2.0.3

      - name: Download sherpa-onnx AAR
        if: steps.cache-sherpa.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx-2.0.3.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar

      - name: Cache Built-in Yunxi Offline Voice Model
        id: cache-kokoro
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/tts_models/kokoro-int8-multi-lang-v1_0
          key: kokoro-int8-zh-assets-v1.0

      - name: Prepare Built-in Yunxi Offline Voice Assets
        if: steps.cache-kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/kokoro_dl app/src/main/assets/tts_models/kokoro-int8-multi-lang-v1_0
          curl -L --fail --retry 3 -o /tmp/kokoro_dl/kokoro.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          tar -xjf /tmp/kokoro_dl/kokoro.tar.bz2 -C /tmp/kokoro_dl
          cp /tmp/kokoro_dl/kokoro-int8-multi-lang-v1_0/model.int8.onnx \
             /tmp/kokoro_dl/kokoro-int8-multi-lang-v1_0/voices.bin \
             /tmp/kokoro_dl/kokoro-int8-multi-lang-v1_0/tokens.txt \
             /tmp/kokoro_dl/kokoro-int8-multi-lang-v1_0/lexicon-zh.txt \
             /tmp/kokoro_dl/kokoro-int8-multi-lang-v1_0/lexicon-us-en.txt \
             /tmp/kokoro_dl/kokoro-int8-multi-lang-v1_0/date-zh.fst \
             /tmp/kokoro_dl/kokoro-int8-multi-lang-v1_0/number-zh.fst \
             /tmp/kokoro_dl/kokoro-int8-multi-lang-v1_0/phone-zh.fst \
             app/src/main/assets/tts_models/kokoro-int8-multi-lang-v1_0/
          rm -rf /tmp/kokoro_dl

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename and Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk YueDu-v0.4.0-debug.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs YueDu-v0.4.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueDu-v0.4.0-debug-apk
          path: YueDu-v0.4.0-debug.apk

      - name: Publish v0.4.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-preview
          name: 悦读 YueDu v0.4.0
          body: |
            悦读 YueDu v0.4.0 更新内容：
            - 字体库直连 Google Fonts 中国大陆 CDN 与高速 jsDelivr 节点，下载提速至秒级
            - 将「云希」拟真离线语音内置进安装包，断网或在线超时自动本地离线兜底
            - 去除轻量离线版与系统本机音色，彻底修复点击单个音色下载导致全部音色同步下载的 Bug
            - 全新重构 AI 阅读页面，采用 iOS 分组列表结构，布局简洁清爽
          files: YueDu-v0.4.0-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
