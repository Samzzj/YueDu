name: Build YueDu Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YueDu-v0.2.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueDu-v0.2.0-debug-apk
          path: YueDu-v0.2.0-debug.apk

      - name: Publish Preview Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-preview
          name: 悦读 YueDu v0.2.0 预览版
          body: |
            v0.2.0 体验优化版：
            - 修复 Wi-Fi 传书中文书名乱码问题（支持自动修复历史乱码并支持长按改名）
            - 默认字号 28、行距 1.3、段距 10dp，新增统一实底阅读设置面板（滑块 + 按钮调节字号/行距/段距）
            - 支持三种翻页方式：仿真翻页（拟真卷页阴影）、平滑翻页、上下翻页
            - 修复顶部阅读区域安全边距，避开灵动岛 / 挖孔区域
            - 字体管理精简默认无衬线字体，新增 Wi-Fi 导入字体入口
          files: YueDu-v0.2.0-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
